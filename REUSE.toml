version = 1

# Files that cannot carry a comment header are declared here.

[[annotations]]
path = ".gitmodules"
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# Test model (models/conv/make_model.py) and the V6 test vectors made
# from it (tests/compiler/test_conv_model.py --update-vectors)
[[annotations]]
path = ["models/conv/conv.tflite", "models/conv/vectors/*"]
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# MNIST test images: models/mnist/make_model.py writes the first image of
# each digit in the MNIST test set, quantized to int8. MNIST is Copyright
# Yann LeCun and Corinna Cortes and licensed CC BY-SA 3.0.
[[annotations]]
path = "models/mnist/digits/*"
SPDX-FileCopyrightText = "Yann LeCun and Corinna Cortes"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# The MNIST CNN that models/mnist/make_model.py trains on MNIST, declared
# under MNIST's license (docs/design.md 12.4)
[[annotations]]
path = "models/mnist/mnist.tflite"
SPDX-FileCopyrightText = ["2026 Kiwon Kwon", "Yann LeCun and Corinna Cortes"]
SPDX-License-Identifier = "CC-BY-SA-3.0"

# The V6 test vectors of the MNIST CNN (tests/compiler/test_mnist_model.py
# --update-vectors): the compiled models and TFLite Micro's outputs are
# declared like the model; the inputs that are not MNIST images are not
# derived from MNIST (docs/design.md 12.4)
[[annotations]]
path = ["models/mnist/vectors/*.knpu", "models/mnist/vectors/expected-*.bin"]
SPDX-FileCopyrightText = ["2026 Kiwon Kwon", "Yann LeCun and Corinna Cortes"]
SPDX-License-Identifier = "CC-BY-SA-3.0"

[[annotations]]
path = ["models/mnist/vectors/random-*.bin", "models/mnist/vectors/all-*.bin"]
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# The ResNet-8 that models/resnet8/make_model.py trains on CIFAR-10,
# which states no license; its images are not in this repository
# (docs/design.md 12.4)
[[annotations]]
path = "models/resnet8/resnet8.tflite"
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# ResNet-8 test photographs: models/resnet8/make_photos.py reduces
# photographs from Wikimedia Commons that their authors released under
# CC0-1.0 to 32x32 int8 inputs; the script lists their sources
