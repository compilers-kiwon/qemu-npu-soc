path = "models/resnet8/photos/photo-airplane.bin"
SPDX-FileCopyrightText = "Balon Greyjoy"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "models/resnet8/photos/photo-automobile.bin"
