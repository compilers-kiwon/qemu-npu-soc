version = 1

# Files that cannot carry a comment header are declared here.

[[annotations]]
path = ".gitmodules"
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# Test model (models/conv/make_model.py) and the V6 test vectors made
# from it (tests/compiler/test_conv_model.py --update-vectors)
[[annotations]]
path = ["models/conv/conv.tflite", "models/conv/vectors/*"]
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# Generated by Cargo, which keeps no comment header
[[annotations]]
path = "runtime/Cargo.lock"
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

[[annotations]]
path = "br2-external/configs/*_defconfig"
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Glue patches for upstream trees carry the upstream's license
[[annotations]]
path = "hw/qemu/patches/*.patch"
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = [
    "firmware/u-boot/board/kiwon/kn1-evb/MAINTAINERS",
    "firmware/u-boot/configs/*_defconfig",
    "firmware/u-boot/patches/*.patch",
]
SPDX-FileCopyrightText = "2026 Kiwon Kwon"
SPDX-License-Identifier = "GPL-2.0-or-later"
