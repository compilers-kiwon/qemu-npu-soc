name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BR_MAKE: make -C buildroot O=${{ github.workspace }}/output BR2_EXTERNAL=${{ github.workspace }}/br2-external

jobs:
  buildroot-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install host dependencies of check-package
        run: sudo apt-get install -y python3-magic python3-flake8 shellcheck

      - name: Load kn1_evb_defconfig
        run: $BR_MAKE kn1_evb_defconfig

      - name: Check that the defconfig is minimal
        run: |
          $BR_MAKE savedefconfig
          git diff --exit-code -- br2-external/configs/

      - name: Run check-package on the br2-external tree
        run: >
          buildroot/utils/check-package -b
          br2-external/configs/kn1_evb_defconfig
          br2-external/external.mk
          br2-external/Config.in
          br2-external/package/*/*
          br2-external/boot/*/*
          br2-external/board/*/*
          br2-external/patches/*/*.hash

  # V2 and V3 (docs/design.md 11): the shared NPU core against the pinned
  # TFLite Micro reference kernels, and its error and wait rules
  npu-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure (downloads the pinned TFLite Micro files)
        run: cmake -S tests/npu-core -B build/npu-core

      - name: Build
        run: cmake --build build/npu-core --parallel

      - name: Run V2 and V3
        run: ctest --test-dir build/npu-core --output-on-failure

  # Schema checks of the kn1-npu binding and the kn1-evb device tree against
  # the pinned Linux release (M1.6)
  dt-binding:
    runs-on: ubuntu-24.04
    env:
      LINUX_TARBALL: linux-7.3.1.tar.xz
    steps:
      - uses: actions/checkout@v7

      - name: Install dt-schema, yamllint, flex and bison
        run: |
          sudo apt-get install -y flex bison
          python3 -m venv "$HOME/dt-venv"
          "$HOME/dt-venv/bin/pip" install --quiet dtschema==2026.9 yamllint==1.38.0
          echo "$HOME/dt-venv/bin" >> "$GITHUB_PATH"

      - name: Restore the Linux source tarball
        id: linux-cache
        uses: actions/cache@v6
        with:
          path: dl/${{ env.LINUX_TARBALL }}
          key: ${{ env.LINUX_TARBALL }}

      - name: Download the Linux source tarball
        if: steps.linux-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dl
          wget -q -O "dl/$LINUX_TARBALL" "https://cdn.kernel.org/pub/linux/kernel/v7.x/$LINUX_TARBALL"

      # The same hash Buildroot checks when it builds the kernel
      - name: Check the tarball hash
        run: |
          awk -v f="$LINUX_TARBALL" '$1 == "sha256" && $3 == f {print $2 "  dl/" f}' \
            br2-external/patches/linux/linux.hash | sha256sum -c -

      - name: Check the binding and the device tree
        run: tests/dt/check-dt.sh "dl/$LINUX_TARBALL"

  reuse-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v6
