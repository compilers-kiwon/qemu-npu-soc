name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  buildroot-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install host dependencies of check-package
        run: sudo apt-get install -y python3-magic python3-flake8 shellcheck

      - name: Load kn1_evb_defconfig
        run: make defconfig

      - name: Check that the defconfig is minimal
        run: |
          make br-savedefconfig
          git diff --exit-code -- br2-external/configs/

      - name: Run check-package on the br2-external tree
        run: >
          buildroot/utils/check-package -b
          br2-external/configs/kn1_evb_defconfig
          br2-external/external.mk
          br2-external/Config.in
          br2-external/package/*/*
          br2-external/boot/*/*
          br2-external/linux/*
          br2-external/board/*/*
          br2-external/patches/*/*.hash

  # V2 and V3 (docs/design.md 11): the shared NPU core against the pinned
  # TFLite Micro reference kernels, and its error and wait rules
  npu-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Downloads the pinned TFLite Micro files, builds and runs ctest
      - name: Run V2 and V3
        run: make check-npu-core

  # V2 to V4 for the model compiler: lit tests of the knpu dialect, passes
  # and model file writer, and the test models compiled from their .tflite
  # through tflite2c, lcc and knpu-compile, run on the shared NPU core (the
  # CPU code on qemu-aarch64) and compared with the TFLite Micro interpreter
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # LLVM 23 with clang and lld for the CPU code of a model, and the
      # aarch64 cross gcc, C library and qemu-user that run it (V3)
      - name: Install LLVM/MLIR 23 (apt.llvm.org), Ninja and the aarch64 tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y libmlir-23-dev mlir-23-tools llvm-23-dev \
            llvm-23-tools clang-23 lld-23 ninja-build \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      # Makes the generator's venv (PyPI flatbuffers), downloads lcc, the
      # lcc_llvm source, TFLite Micro and FlatBuffers, builds lcc-opt and
      # the compiler and runs ctest
      - name: Run V4 (lit) and V2, V3 (end to end)
        run: make check-compiler

  # Host tests of the runtime (docs/design.md 10): model.knpu parsing and
  # checks on the committed test models, the hand-written UAPI against
  # knpu_accel.h, and knpu-infer's command line. Rust is the version
  # Buildroot builds the runtime with.
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Run the host tests
        run: make check-runtime

  # Schema checks of the kn1-npu binding and the kn1-evb device tree against
  # the pinned Linux release (M1.6)
  dt-binding:
    runs-on: ubuntu-24.04
    env:
      LINUX_TARBALL: linux-7.3.1.tar.xz
    steps:
      - uses: actions/checkout@v7

      - name: Install dt-schema, yamllint, flex and bison
        run: |
          sudo apt-get install -y flex bison
          python3 -m venv "$HOME/dt-venv"
          "$HOME/dt-venv/bin/pip" install --quiet dtschema==2026.9 yamllint==1.38.0
          echo "$HOME/dt-venv/bin" >> "$GITHUB_PATH"

      - name: Restore the Linux source tarball
        id: linux-cache
        uses: actions/cache@v6
        with:
          path: dl/${{ env.LINUX_TARBALL }}
          key: ${{ env.LINUX_TARBALL }}

      - name: Download the Linux source tarball
        if: steps.linux-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dl
          wget -q -O "dl/$LINUX_TARBALL" "https://cdn.kernel.org/pub/linux/kernel/v7.x/$LINUX_TARBALL"

      # The same hash Buildroot checks when it builds the kernel
      - name: Check the tarball hash
        run: |
          awk -v f="$LINUX_TARBALL" '$1 == "sha256" && $3 == f {print $2 "  dl/" f}' \
            br2-external/patches/linux/linux.hash | sha256sum -c -

      - name: Check the binding and the device tree
        run: tests/dt/check-dt.sh "dl/$LINUX_TARBALL"

  # Upstream style checks (docs/design.md 11): the checkpatch.pl of QEMU,
  # Linux, U-Boot and TF-A on the files that go into their trees
  checkpatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio file rsync unzip wget

      - name: Restore the source tarballs
        uses: actions/cache@v6
        with:
          path: |
            buildroot/dl/qemu-kn1/*.tar.*
            buildroot/dl/linux/*.tar.*
            buildroot/dl/uboot/*.tar.*
            buildroot/dl/arm-trusted-firmware/*.tar.*
          key: checkpatch-${{ hashFiles('br2-external/package/qemu-kn1/qemu-kn1.hash', 'br2-external/patches/*/*.hash') }}

      # Buildroot downloads the tarballs that are not in the cache and checks
      # them against the same .hash files as the build
      - name: Check the style
        run: make check-style

  # REUSE compliance and the license of every file against the table of
  # docs/design.md 12.4
  reuse-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # reuse lint, then the table check on its report
      - name: Check REUSE compliance and the license table
        run: make check-licenses
