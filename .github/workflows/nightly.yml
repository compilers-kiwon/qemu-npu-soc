# Full Buildroot build, the check that kn1_defconfig is in savedefconfig
# form, boot smoke test, V1, V5, V6 and the legal-info check (docs/design.md
# D42, 11). Runs every night and on demand; the per-push checks are in
# ci.yml.

name: Nightly

on:
  schedule:
    # Not on the hour: GitHub may delay scheduled runs at the start of an
    # hour, a time of high load
    - cron: '23 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  full-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # The runner's SSD is listed at 14 GB and a full build needs about
      # 20 GB (output/ and the download directory), so drop large
      # preinstalled toolchains we do not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio file rsync unzip wget

      # Only the downloads are cached; every run builds from scratch.
      - name: Compute the download cache key
        id: dl-key
        run: echo "buildroot=$(git rev-parse HEAD:buildroot)" >> "$GITHUB_OUTPUT"

      - name: Restore the download directory
        uses: actions/cache@v6
        with:
          path: buildroot/dl
          key: buildroot-dl-${{ steps.dl-key.outputs.buildroot }}-${{ hashFiles('br2-external/configs/kn1_evb_defconfig', 'br2-external/patches/*/*.hash', 'br2-external/package/*/*.hash') }}
          restore-keys: |
            buildroot-dl-${{ steps.dl-key.outputs.buildroot }}-
            buildroot-dl-

      - name: Load kn1_evb_defconfig
        run: make defconfig

      # The full log goes to a file; only Buildroot's per-step lines are shown.
      - name: Build
        id: build
        run: make 2>&1 | tee build.log | grep --line-buffered '^>>>'

      # kn1_defconfig is the kernel's savedefconfig output (docs/design.md
      # 8.1): saving the configuration of this build must not change it.
      - name: Check that kn1_defconfig is in savedefconfig form
        run: |
          make br-linux-update-defconfig
          git diff --exit-code -- br2-external/board/kn1-evb/kn1_defconfig

      # Runs after a successful build even when the check above failed
      - name: Boot smoke test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-boot

      # Runs after a successful build even when the boot test failed
      - name: V1 (kn1-npu qtest, device-introspect-test, qom-test)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-v1

      - name: V5 (knpu driver)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-v5

      - name: V6 (end to end, knpu-infer)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-v6

      # Buildroot's legal-info (docs/design.md 12.4): the only warning is
      # that Buildroot's own source is not saved, and every package of
      # br2-external/ is in the manifests
      - name: Check Buildroot legal-info
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          make br-legal-info > legal-info.log 2>&1 ||
            { tail -n 50 legal-info.log; exit 1; }
          if grep -E '^(WARNING|ERROR)' legal-info.log |
             grep -v -x 'WARNING: the Buildroot source code has not been saved'
          then
            echo 'legal-info: unexpected warnings or errors'
            exit 1
          fi
          for d in br2-external/package/*/; do
            p=$(basename "$d")
            awk -F, -v p="\"$p\"" '$1 == p { found = 1 } END { exit !found }' \
              output/legal-info/manifest.csv \
              output/legal-info/host-manifest.csv ||
              { echo "legal-info: $p is not in the manifests"; exit 1; }
          done

      - name: Keep the end of the build log
        if: failure()
        run: tail -n 500 build.log > build-tail.log || true

      - name: Show disk usage
        if: always()
        run: |
          df -h /
          du -sh output buildroot/dl 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-logs
          path: |
            output/test-logs/
            build-tail.log
          if-no-files-found: ignore
