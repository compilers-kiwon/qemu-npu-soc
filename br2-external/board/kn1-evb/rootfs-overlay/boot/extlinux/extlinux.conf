#
# Read by U-Boot's standard boot (bootmeth extlinux) from the root
# partition of the virtio disk.

default kn1-evb

label kn1-evb
	kernel /boot/Image
	fdt /boot/kn1-evb.dtb
	append root=/dev/vda1 rootwait console=ttyAMA0
