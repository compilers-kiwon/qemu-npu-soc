#
# Boot disk for kn1-evb: a GPT disk with the ext4 root file system (which
# holds /boot/Image, /boot/kn1-evb.dtb and the extlinux.conf) as its only
# partition.

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition root {
		# Linux root (ARM64)
		partition-type-uuid = b921b045-1df0-41c3-af44-4c6f280d3fae
		image = "rootfs.ext2"
		bootable = true
	}
}
